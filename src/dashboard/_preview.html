<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#070714">
<link rel="icon" type="image/svg+xml" href="Data Bloom icon.svg">
<title>BloomPlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

:root {
    --bg-0: #07070f;
    --bg-1: #0b0b1a;
    --bg-2: #10102a;
    --panel: rgba(20, 20, 48, 0.66);
    --panel-solid: #14142e;
    --panel-2: rgba(30, 30, 66, 0.55);
    --panel-hover: rgba(38, 38, 84, 0.8);
    --border: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(255, 255, 255, 0.18);

    --txt-0: #f2f3ff;
    --txt-1: #c6c9ec;
    --txt-2: #8e92bc;
    --txt-3: #5b5e8c;

    --accent: #7c6cff;
    --accent-2: #4ecdc4;
    --green: #2dd4a7;
    --yellow: #f5c451;
    --red: #ff6b6b;
    --cyan: #4ecdc4;
    --blue: #6ea8ff;
    --purple: #a78bfa;
    --pink: #ff6b9d;
    --orange: #ffa25c;

    --grad-accent: linear-gradient(135deg, #7c6cff 0%, #4ecdc4 100%);
    --grad-warm: linear-gradient(135deg, #ff6b9d 0%, #ffa25c 100%);

    --radius-lg: 18px;
    --radius-md: 12px;
    --radius-sm: 9px;
    --shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-top: env(safe-area-inset-top, 0px);

    --font-display: 'Space Grotesk', 'Inter', sans-serif;
    --font-body: 'Inter', sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html { color-scheme: dark; }
html, body { height: 100%; }

body {
    font-family: var(--font-body);
    color: var(--txt-0);
    background: var(--bg-0);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -2;
    background:
        radial-gradient(1000px 560px at 85% -10%, rgba(124, 108, 255, 0.16), transparent 60%),
        radial-gradient(900px 620px at -10% 20%, rgba(78, 205, 196, 0.10), transparent 55%),
        radial-gradient(760px 520px at 50% 110%, rgba(255, 107, 157, 0.08), transparent 60%),
        linear-gradient(160deg, #0a0a1e 0%, #07070f 60%, #0b0b20 100%);
}

body::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background-image:
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(ellipse at 50% 0%, black 30%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse at 50% 0%, black 30%, transparent 75%);
}

.app { display: flex; min-height: 100vh; min-height: 100dvh; }

.sidebar {
    width: 236px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    padding: 26px 16px 18px;
    padding-top: calc(26px + var(--safe-top));
    border-right: 1px solid var(--border);
    background: rgba(10, 10, 28, 0.55);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    position: sticky;
    top: 0;
    height: 100vh;
    height: 100dvh;
}

.brand { display: flex; align-items: center; gap: 12px; padding: 0 8px 22px; border-bottom: 1px solid var(--border); margin-bottom: 18px; }

.brand-mark {
    width: 42px; height: 42px;
    border-radius: 13px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-weight: 700; font-size: 20px;
    color: #fff;
    background: var(--grad-accent);
    box-shadow: 0 8px 24px rgba(124, 108, 255, 0.35);
}

.brand-name { display: block; font-family: var(--font-display); font-weight: 700; font-size: 17px; letter-spacing: 0.2px; }
.brand-sub { display: block; font-size: 10.5px; color: var(--txt-2); letter-spacing: 0.4px; margin-top: 1px; }

.side-nav { display: flex; flex-direction: column; gap: 4px; flex: 1; }

.side-item {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 14px;
    border: none; border-radius: var(--radius-md);
    background: transparent; color: var(--txt-2);
    font-family: var(--font-body); font-size: 13.5px; font-weight: 600;
    cursor: pointer; text-align: left;
    transition: all 0.2s ease; position: relative;
}

.side-ico { width: 22px; font-size: 16px; text-align: center; color: var(--txt-3); transition: color 0.2s ease; }

.side-item:hover { background: rgba(255, 255, 255, 0.04); color: var(--txt-0); }

.side-item.active {
    background: linear-gradient(90deg, rgba(124, 108, 255, 0.16), rgba(124, 108, 255, 0.04));
    color: var(--txt-0);
}
.side-item.active .side-ico { color: var(--accent); }
.side-item.active::before {
    content: "";
    position: absolute; left: -16px; top: 8px; bottom: 8px;
    width: 3px; border-radius: 0 3px 3px 0;
    background: linear-gradient(180deg, var(--accent), var(--accent-2));
}

.side-foot { padding: 12px 6px 0; border-top: 1px solid var(--border); }

.host-pill {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 12px; border-radius: var(--radius-sm);
    background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border);
    font-size: 12px; color: var(--txt-1); overflow: hidden;
}

.host-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--red); flex-shrink: 0;
    box-shadow: 0 0 8px var(--red);
    transition: all 0.3s ease;
}
.host-dot.online { background: var(--green); box-shadow: 0 0 10px var(--green); animation: pulse 2s infinite; }
.host-dot.offline { background: var(--red); box-shadow: 0 0 8px var(--red); }
#hostName { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }

.main {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column;
    padding: 26px 34px 18px;
    padding-top: calc(26px + var(--safe-top));
    max-width: 1440px;
    margin: 0 auto;
}

.topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 24px; }

.topbar-title h1 { font-family: var(--font-display); font-size: 26px; font-weight: 700; letter-spacing: 0.2px; }
.topbar-title p { font-size: 12.5px; color: var(--txt-2); margin-top: 3px; }

.topbar-right { display: flex; align-items: center; gap: 12px; }

.conn {
    display: flex; align-items: center; gap: 7px;
    padding: 6px 13px; border-radius: 999px;
    background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border);
    font-size: 11px; font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase;
}
.conn-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--red); }
.conn.online { color: var(--green); border-color: rgba(45, 212, 167, 0.3); }
.conn.online .conn-dot { background: var(--green); box-shadow: 0 0 8px var(--green); animation: pulse 2s infinite; }
.conn.offline { color: var(--red); border-color: rgba(255, 107, 107, 0.3); }
.conn.offline .conn-dot { background: var(--red); }

.clock { font-family: var(--font-display); font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 600; color: var(--txt-1); padding: 6px 4px; }

.view { flex: 1; }

.main-foot {
    margin-top: 26px; padding-top: 14px;
    border-top: 1px solid var(--border);
    font-size: 11px; color: var(--txt-3);
    display: flex; align-items: center; gap: 6px; justify-content: center;
    flex-wrap: wrap; text-align: center;
}
.credit-heart { color: var(--pink); animation: heartBeat 1.6s ease-in-out infinite; display: inline-block; }
@keyframes heartBeat { 0%,100% { transform: scale(1); } 25% { transform: scale(1.25); } 40% { transform: scale(1); } }

.bottom-nav {
    display: none;
    position: fixed; left: 50%; bottom: 14px;
    transform: translateX(-50%);
    z-index: 60;
    width: min(94%, 560px);
    background: rgba(14, 14, 40, 0.78);
    backdrop-filter: blur(26px) saturate(1.4);
    -webkit-backdrop-filter: blur(26px) saturate(1.4);
    border: 1px solid var(--border-strong);
    border-radius: 999px;
    padding: 7px 10px;
    padding-bottom: calc(7px + var(--safe-bottom));
    justify-content: space-around;
    box-shadow: 0 18px 48px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.08);
}

.bn-item {
    position: relative;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    padding: 7px 12px 6px; border: none; background: transparent;
    color: var(--txt-3); font-family: var(--font-body);
    font-size: 10px; font-weight: 600; cursor: pointer;
    border-radius: 999px; min-width: 52px; transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
}
.bn-ico { font-size: 19px; line-height: 1; transition: transform 0.22s cubic-bezier(0.4, 0, 0.2, 1); }
.bn-item.active {
    color: #fff;
    background: linear-gradient(180deg, rgba(124, 108, 255, 0.45), rgba(124, 108, 255, 0.12));
    box-shadow: 0 4px 18px rgba(124, 108, 255, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.18);
}
.bn-item.active .bn-ico { transform: translateY(-2px) scale(1.12); }
.bn-item.active::after {
    content: ""; position: absolute; top: -5px; left: 50%; transform: translateX(-50%);
    width: 22px; height: 6px; border-radius: 999px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    box-shadow: 0 0 10px rgba(124, 108, 255, 0.8);
}
.bn-item:active { transform: scale(0.9); }

.card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    position: relative;
    overflow: hidden;
    animation: rise 0.35s ease both;
}

@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.card-head { display: flex; align-items: center; gap: 11px; margin-bottom: 16px; }

.card-ico {
    width: 38px; height: 38px; border-radius: 11px;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; flex-shrink: 0;
    background: rgba(124, 108, 255, 0.12); border: 1px solid rgba(124, 108, 255, 0.22);
}
.card-ico.c1 { background: rgba(124,108,255,0.12); border-color: rgba(124,108,255,0.25); }
.card-ico.c2 { background: rgba(78,205,196,0.12); border-color: rgba(78,205,196,0.25); }
.card-ico.c3 { background: rgba(255,107,157,0.12); border-color: rgba(255,107,157,0.25); }
.card-ico.c4 { background: rgba(255,162,92,0.12); border-color: rgba(255,162,92,0.25); }
.card-ico.c5 { background: rgba(110,168,255,0.12); border-color: rgba(110,168,255,0.25); }

.card-title { font-family: var(--font-display); font-size: 15.5px; font-weight: 600; flex: 1; }
.card-sub { font-size: 10.5px; color: var(--txt-2); letter-spacing: 0.6px; text-transform: uppercase; }
.card-actions { display: flex; gap: 8px; flex-wrap: wrap; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.stat-grid { margin-bottom: 16px; }

.stat-tile {
    background: rgba(0, 0, 0, 0.25);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 16px;
    transition: all 0.25s ease;
    position: relative;
    overflow: hidden;
}
.stat-tile:hover { border-color: var(--border-strong); transform: translateY(-2px); }
.stat-tile::after {
    content: "";
    position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, var(--tile-color, var(--accent)), transparent);
    opacity: 0.8;
}

.stat-top { display: flex; align-items: center; gap: 9px; margin-bottom: 12px; }
.stat-ico {
    width: 30px; height: 30px; border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; background: rgba(255, 255, 255, 0.05);
}
.stat-name { font-size: 11px; font-weight: 600; color: var(--txt-2); text-transform: uppercase; letter-spacing: 0.5px; }

.stat-main { display: flex; align-items: baseline; gap: 6px; }
.stat-value { font-family: var(--font-display); font-size: 30px; font-weight: 700; line-height: 1.05; }
.stat-unit { font-size: 13px; color: var(--txt-2); font-weight: 500; }
.stat-mini { font-size: 10.5px; color: var(--txt-2); margin-top: 4px; }

.bar-track { height: 6px; background: rgba(255, 255, 255, 0.06); border-radius: 6px; overflow: hidden; margin-top: 12px; }
.bar-fill { height: 100%; border-radius: 6px; transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1); }

.gauge-tile { text-align: center; padding: 18px 14px; --tile-color: var(--g1); }
.gauge-tile .stat-mini { text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gauge-wrap { display: flex; flex-direction: column; align-items: center; }
.gauge {
    --pct: 0;
    width: 104px; height: 104px; border-radius: 50%;
    background:
        radial-gradient(circle at center, rgba(16,16,42,0.95) 0 60%, transparent 61%),
        conic-gradient(var(--g1, var(--accent)) calc(var(--pct) * 1%), rgba(255,255,255,0.07) 0);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative; flex-shrink: 0;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.05), 0 8px 26px rgba(0,0,0,0.35);
    transition: transform 0.25s ease;
}
.gauge-tile:hover .gauge { transform: scale(1.04); }
.gauge-val {
    position: relative; z-index: 1;
    font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1;
    color: var(--g1, var(--accent));
}
.gauge-unit {
    position: relative; z-index: 1;
    font-size: 9px; color: var(--txt-2); margin-top: 3px;
    text-transform: uppercase; letter-spacing: 0.8px;
}
.gauge-label { display: flex; align-items: center; gap: 6px; margin-top: 12px; font-size: 12px; font-weight: 600; color: var(--txt-1); }
.gauge-ico { font-size: 14px; color: var(--g1, var(--accent)); }

.therm-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.therm { display: flex; flex-direction: column; align-items: center; gap: 7px; }
.therm-track {
    width: 24px; height: 120px; border-radius: 999px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--border);
    position: relative; overflow: hidden;
    display: flex; align-items: flex-end;
}
.therm-fill {
    width: 100%; height: 0%;
    background: linear-gradient(180deg, #2dd4a7, #4ecdc4);
    border-radius: 999px;
    box-shadow: 0 0 12px rgba(45, 212, 167, 0.45);
    transition: height 0.7s cubic-bezier(0.4, 0, 0.2, 1), background 0.5s ease;
}
.therm-val b { font-family: var(--font-display); font-size: 24px; font-weight: 700; }
.therm-val span { font-size: 11px; color: var(--txt-2); }
.therm-label { font-size: 11px; font-weight: 600; color: var(--txt-2); text-transform: uppercase; letter-spacing: 0.5px; }

.chart-box { width: 100%; }
.perf-svg { width: 100%; height: auto; display: block; min-height: 140px; }
.mini-chart { width: 100%; height: 70px; display: block; margin-top: 8px; }
.cgrid line { stroke: rgba(255, 255, 255, 0.06); stroke-width: 1; }
.cline { fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.aline { stroke: none; vector-effect: non-scaling-stroke; }
.c-cpu { stroke: #7c6cff; }
.c-gpu { stroke: #ff6b9d; }
.c-ram { stroke: #2dd4a7; }
.a-down { stroke: #4ecdc4; }
.a-up { stroke: #6ea8ff; }

.chart-legend { display: flex; flex-wrap: wrap; gap: 14px; margin-left: 8px; }
.chart-legend .lg { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--txt-2); }
.chart-legend .lg i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
.chart-legend .lg b { color: var(--txt-0); font-family: var(--font-display); font-size: 12px; }

.net-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.net-col { min-width: 0; }
.ping-row {
    display: flex; align-items: center; gap: 8px;
    margin-top: 14px; padding-top: 12px;
    border-top: 1px solid var(--border);
    font-size: 12.5px; color: var(--txt-2);
}
.ping-row b { font-family: var(--font-display); font-size: 18px; color: var(--txt-0); }
.ping-tag { margin-left: auto; font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 999px; }
.ping-tag.good { color: var(--green); background: rgba(45,212,167,0.12); }
.ping-tag.ok { color: var(--yellow); background: rgba(245,196,81,0.12); }
.ping-tag.bad { color: var(--red); background: rgba(255,107,107,0.12); }

.c-green { color: var(--green); }  .c-yellow { color: var(--yellow); }
.c-red { color: var(--red); }      .c-cyan { color: var(--cyan); }
.c-blue { color: var(--blue); }    .c-purple { color: var(--purple); }
.c-pink { color: var(--pink); }    .c-orange { color: var(--orange); }
.c-dim { color: var(--txt-2); }

.f-green { background: var(--green); }  .f-yellow { background: var(--yellow); }
.f-red { background: var(--red); }      .f-cyan { background: var(--cyan); }
.f-blue { background: var(--blue); }    .f-purple { background: var(--purple); }
.f-pink { background: var(--pink); }    .f-orange { background: var(--orange); }

.btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 10px 18px; border-radius: 12px;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.05);
    color: var(--txt-0);
    font-family: var(--font-body); font-size: 13px; font-weight: 600;
    cursor: pointer; transition: all 0.2s ease;
    user-select: none; white-space: nowrap;
}
.btn:hover { background: rgba(255, 255, 255, 0.09); border-color: var(--border-strong); }
.btn:active { transform: scale(0.96); }
.btn-primary { background: var(--grad-accent); border: none; color: #fff; box-shadow: 0 8px 24px rgba(124, 108, 255, 0.3); }
.btn-primary:hover { filter: brightness(1.08); background: var(--grad-accent); }
.btn-danger { background: rgba(255, 107, 107, 0.12); border-color: rgba(255, 107, 107, 0.35); color: var(--red); }
.btn-danger:hover { background: rgba(255, 107, 107, 0.22); }
.btn-ghost { background: transparent; }
.btn-ghost:hover { background: rgba(255, 255, 255, 0.05); }
.btn-sm { padding: 7px 13px; font-size: 12px; border-radius: 10px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.btn-spin { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.hw-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

.hw-panel {
    background: rgba(0, 0, 0, 0.22);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 16px;
    min-width: 0;
    position: relative;
    overflow: hidden;
    transition: border-color 0.25s ease, transform 0.25s ease;
}
.hw-panel:hover { transform: translateY(-2px); }
.hw-panel--full { grid-column: 1 / -1; }

.hw-panel { --hp: var(--accent); }
.hw-panel::before {
    content: ""; position: absolute; top: 0; left: 0; bottom: 0; width: 3px;
    background: linear-gradient(180deg, var(--hp), transparent);
    opacity: 0.9;
}
.hw-panel .hw-panel-ico { background: rgba(255, 255, 255, 0.06); color: var(--hp); }
.hw-panel .hw-panel-title { color: color-mix(in srgb, var(--hp) 65%, var(--txt-0)); }
.hw-panel .hw-panel-tag { color: var(--hp); border-color: color-mix(in srgb, var(--hp) 40%, transparent); background: color-mix(in srgb, var(--hp) 12%, transparent); }
.hw-panel.hp-cpu { --hp: #7c6cff; border-color: rgba(124, 108, 255, 0.18); }
.hw-panel.hp-gpu { --hp: #ff6b9d; border-color: rgba(255, 107, 157, 0.18); }
.hw-panel.hp-ram { --hp: #2dd4a7; border-color: rgba(45, 212, 167, 0.18); }
.hw-panel.hp-disk { --hp: #6ea8ff; border-color: rgba(110, 168, 255, 0.18); }
.hw-panel.hp-sys { --hp: #4ecdc4; border-color: rgba(78, 205, 196, 0.18); }
.hw-panel.hp-mobo { --hp: #a78bfa; border-color: rgba(167, 139, 250, 0.18); }
.hw-panel.hp-display { --hp: #ffa25c; border-color: rgba(255, 162, 92, 0.18); }
.hw-panel.hp-audio { --hp: #f5c451; border-color: rgba(245, 196, 81, 0.18); }
.hw-panel.hp-batt { --hp: #2dd4a7; border-color: rgba(45, 212, 167, 0.18); }
.hw-panel .hw-value { color: color-mix(in srgb, var(--hp) 42%, #fff); font-weight: 650; }
.hw-panel .disk-name { color: var(--hp); }

function jsonOk(obj) {
    return Promise.resolve(new Response(JSON.stringify(obj), {
        status: 200,
        headers: { 'Content-Type': 'application/json' },

function demoApi(url, opts) {
    const method = (opts && opts.method) || 'GET';
    const u = url.split('?')[0];

    if (method === 'GET') {
        if (u === '/stats') return jsonOk(demoStats());
        if (u === '/hardware') return jsonOk(demo.hardware);
        if (u === '/system') return jsonOk({ hostname: 'GAMING-RIG', os: 'Windows 11 Pro', total_storage: '1536 GB' });
        if (u === '/screenshot/list') return jsonOk({ folder: 'C:\\Users\\Gamer\\Pictures\\BloomPlay', screenshots: demo.shots });
        if (u === '/devices') return jsonOk({ devices: demo.devices });
        if (u === '/devices/blocked') return jsonOk({ blocked: demo.blocked });
        if (u === '/overlay/config') return jsonOk(demo.overlay);
    } else {
        if (u === '/screenshot/capture') {
            const d = new Date();
            demo.shots.unshift({ name: `Screenshot_${d.toISOString().slice(0, 19).replace(/[:T]/g, '-')}.png`, size: 900000, mtime: Math.floor(d.getTime() / 1000) });
            return jsonOk({ name: demo.shots[0].name, path: '', size: 900000 });
        }
        if (u === '/screenshot/delete') {
            try {
                const body = JSON.parse((opts && opts.body) || '{}');
                demo.shots = demo.shots.filter(s => s.name !== body.name);
            } catch {}
            return jsonOk({ deleted: true });
        }
        if (u === '/overlay/config') {
            try {
                const body = JSON.parse((opts && opts.body) || '{}');
                Object.assign(demo.overlay, body);
            } catch {}
            return jsonOk(demo.overlay);
        }
        if (u === '/export/pdf') {
            return Promise.resolve(new Response(new Blob(['%PDF-1.4 demo']), {
                status: 200,
                headers: { 'Content-Type': 'application/pdf' },
            }));
        }
        if (u === '/devices/disconnect') {
            const ip = new URLSearchParams(url.split('?')[1] || '').get('ip');
            demo.devices = demo.devices.filter(d => d.ip !== ip);
            return jsonOk({ disconnected: true });
        }
        if (u === '/devices/unblock') {
            demo.blocked = [];
            return jsonOk({ unblocked: true });
        }
        if (u === '/shutdown') return jsonOk({ status: 'shutting down' });
    }
    return jsonOk({});
}

function safe(val, fb = '—') {
    if (val === undefined || val === null || val === '') return fb;
    if (typeof val === 'object') { try { return JSON.stringify(val); } catch { return '[obj]'; } }
    return String(val);
}
function safeHtml(val, fb = '—') { return esc(safe(val, fb)); }
function num(v) { const n = Number(v); return isNaN(n) ? 0 : n; }
function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function fillClass(v, warn = 70, crit = 85) {
    const n = num(v);
    if (n >= crit) return 'f-red';
    if (n >= warn) return 'f-yellow';
    return 'f-green';
}

function shotImgSrc(name) {
    if (!DEMO_MODE) {
        return '/screenshot/file?name=' + encodeURIComponent(name) + '&token=' + encodeURIComponent(ACCESS_TOKEN);
    }
    let h = 0;
    for (let i = 0; i < String(name).length; i++) h = (h * 31 + String(name).charCodeAt(i)) >>> 0;
    const hue = h % 360;
    return 'data:image/svg+xml;utf8,' + encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" width="320" height="200">' +
        '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +
        '<stop offset="0" stop-color="hsl(' + hue + ',45%,22%)"/>' +
        '<stop offset="1" stop-color="hsl(' + ((hue + 45) % 360) + ',45%,9%)"/>' +
        '</linearGradient></defs><rect width="320" height="200" fill="url(#g)"/>' +
        '<circle cx="160" cy="92" r="24" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="3"/>' +
        '<circle cx="160" cy="92" r="7" fill="rgba(255,255,255,0.4)"/>' +
        '<path d="M126 138 L162 108 L188 126 L214 106 L240 130 L240 140 L126 140 Z" fill="rgba(255,255,255,0.18)"/>' +
        '</svg>');
}

function smoothPath(values, w, h, minV, maxV) {
    if (values.length < 2) return '';
    const range = (maxV - minV) || 1;
    const pts = values.map((v, i) => [(i / (values.length - 1)) * w, h - ((Math.min(maxV, Math.max(minV, v)) - minV) / range) * h]);
    let d = 'M ' + pts[0][0].toFixed(1) + ' ' + pts[0][1].toFixed(1);
    for (let i = 0; i < pts.length - 1; i++) {
        const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
        const c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
        const c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
        d += ' C ' + c1x.toFixed(1) + ' ' + c1y.toFixed(1) + ' ' + c2x.toFixed(1) + ' ' + c2y.toFixed(1) + ' ' + p2[0].toFixed(1) + ' ' + p2[1].toFixed(1);
    }
    return d;
}
function areaPath(values, w, h, minV, maxV) {
    const line = smoothPath(values, w, h, minV, maxV);
    if (!line) return '';
    return line + ' L ' + w.toFixed(1) + ' ' + h.toFixed(1) + ' L 0 ' + h.toFixed(1) + ' Z';
}
function pushHist(key, v) {
    hist[key].push(num(v));
    if (hist[key].length > HIST_MAX) hist[key].shift();
}

    if (t >= 70) return 'linear-gradient(180deg,#ffa25c,#ff6b6b)';

    return 'linear-gradient(180deg,#2dd4a7,#4ecdc4)';
}

function updateOverview(data) {
    const cpu = num(data.cpu);
    const gpuObj = data.gpu || {};
    const gpu = num(gpuObj.usage);
    const ram = data.ram || {};
    const ramPct = num(ram.percent);
    const net = data.network || {};
    const down = num(net.download), up = num(net.upload), ping = num(net.ping);
    const bat = data.battery || {};
    const fpsObj = data.fps || {};

    pushHist('cpu', cpu); pushHist('gpu', gpu); pushHist('ram', ramPct);
    pushHist('down', down); pushHist('up', up);

    updateGauge('cpu', cpu);
    setText('cpuVal', Math.round(cpu));
    setText('cpuMini', cpu >= 85 ? 'High load' : cpu >= 70 ? 'Moderate load' : 'Normal load');

    updateGauge('gpu', gpu);
    setText('gpuVal', Math.round(gpu));
    setText('gpuMini', safeHtml(gpuObj.name, 'GPU'));

    updateGauge('ram', ramPct);
    setText('ramVal', num(ram.used).toFixed(1));
    setText('ramMini', num(ram.total) ? `${Math.round(ramPct)}% of ${num(ram.total).toFixed(0)} GB` : '—');

    const fps = fpsObj.fps;
    updateGauge('fps', fps === null || fps === undefined ? 0 : fps > 240 ? 100 : (fps / 240) * 100);
    setText('fpsVal', fps === null || fps === undefined ? 'N/A' : Math.round(fps));
    setText('fpsMini', safeHtml(fpsObj.status, ''));

    const W = 600, H = 200;
    document.getElementById('lineCpu').setAttribute('d', smoothPath(hist.cpu, W, H, 0, 100));
    document.getElementById('areaCpu').setAttribute('d', areaPath(hist.cpu, W, H, 0, 100));
    document.getElementById('lineGpu').setAttribute('d', smoothPath(hist.gpu, W, H, 0, 100));
    document.getElementById('areaGpu').setAttribute('d', areaPath(hist.gpu, W, H, 0, 100));
    document.getElementById('lineRam').setAttribute('d', smoothPath(hist.ram, W, H, 0, 100));
    document.getElementById('areaRam').setAttribute('d', areaPath(hist.ram, W, H, 0, 100));
    setText('lgCpu', Math.round(cpu) + '%');
    setText('lgGpu', Math.round(gpu) + '%');
    setText('lgRam', Math.round(ramPct) + '%');

    const NW = 300, NH = 80;
    const netMax = Math.max(Math.max(...hist.down, 1), Math.max(...hist.up, 1)) * 1.15;
    document.getElementById('lineDown').setAttribute('d', smoothPath(hist.down, NW, NH, 0, netMax));
    document.getElementById('areaDown').setAttribute('d', areaPath(hist.down, NW, NH, 0, netMax));
    document.getElementById('lineUp').setAttribute('d', smoothPath(hist.up, NW, NH, 0, netMax));
    document.getElementById('areaUp').setAttribute('d', areaPath(hist.up, NW, NH, 0, netMax));
    setText('netDown', down.toFixed(1));
    setText('netUp', up.toFixed(1));

    setText('pingVal', Math.round(ping));
    const tag = document.getElementById('pingTag');
    if (tag) {
        if (ping < 80) { tag.textContent = 'Great'; tag.className = 'ping-tag good'; }
        else if (ping < 150) { tag.textContent = 'Good'; tag.className = 'ping-tag ok'; }
        else { tag.textContent = 'Poor'; tag.className = 'ping-tag bad'; }
    }

    const cpuT = data.cpu_temp;
    const gpuT = gpuObj.temp;
    const cpuFill = document.getElementById('cpuThermFill');
    const gpuFill = document.getElementById('gpuThermFill');
    if (cpuT === null || cpuT === undefined) {
        setStyle('cpuThermFill', 'height', '0%');
        setText('cpuTempBig', '—');
        setText('cpuTempStatus', 'Sensor unavailable');
    } else {
        setStyle('cpuThermFill', 'height', Math.min(100, num(cpuT)) + '%');
        if (cpuFill) cpuFill.style.background = tempColor(num(cpuT));
        setText('cpuTempBig', Math.round(cpuT));
        setText('cpuTempStatus', safeHtml(data.cpu_temp_status, 'Live reading'));
    }
    if (gpuT === null || gpuT === undefined) {
        setStyle('gpuThermFill', 'height', '0%');
        setText('gpuTempBig', '—');
        setText('gpuTempMini', 'Sensor unavailable');
    } else {
        setStyle('gpuThermFill', 'height', Math.min(100, num(gpuT)) + '%');
        if (gpuFill) gpuFill.style.background = tempColor(num(gpuT));
        setText('gpuTempBig', Math.round(gpuT));
        setText('gpuTempMini', gpuT >= 85 ? 'Hot' : gpuT >= 70 ? 'Warm' : 'Normal');
    }

    const pct = bat.percent;
    if (pct === null || pct === undefined || pct === 'N/A') {
        updateGauge('bat', 0);
        setText('batVal', '—'); setText('batMini', 'No battery (desktop)');
    } else {
        updateGauge('bat', pct);
        setText('batVal', Math.round(num(pct)));
        setText('batMini', bat.charging ? '⚡ Charging' : 'On battery');
    }

    const hp = bat.health_percent;
    if (hp === null || hp === undefined) {
        updateGauge('bh', 0);
        setText('bhVal', '—'); setText('bhMini', 'Unavailable');
    } else {
        updateGauge('bh', hp);
        setText('bhVal', Math.round(num(hp)));
        setText('bhMini', safeHtml(bat.health_label, num(hp) >= 90 ? 'Excellent' : 'Good'));
    }
}

async function exportPdf() {
    toast('Generating PDF…');
    try {
        const res = await api('/export/pdf', { method: 'POST' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'BloomPlay_Hardware.pdf';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 4000);
        toast('PDF downloaded');
    } catch {
        toast('PDF export failed', 'err');
    }
}

function wireScreenshots() {
    const fullBtn = document.getElementById('shotFull');
    const winBtn = document.getElementById('shotWin');
    const refresh = document.getElementById('shotRefresh');
    if (fullBtn) fullBtn.addEventListener('click', () => captureShot('full'));
    if (winBtn) winBtn.addEventListener('click', () => captureShot('window'));
    if (refresh) refresh.addEventListener('click', loadShots);

    document.querySelectorAll('.shot').forEach(shot => {
        shot.addEventListener('click', (e) => {
            if (e.target.closest('.shot-del')) return;
            openLightbox(shot.querySelector('img').src);
        });
    });
    document.querySelectorAll('.shot-del').forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const name = btn.dataset.del;
            confirmBox('Delete screenshot?', `This permanently removes "${name}" from the PC.`, () => deleteShot(name));
        });
    });
}

async function captureShot(kind) {
    toast('Capturing…');
    try {
        const res = await api('/screenshot/capture', { method: 'POST', body: JSON.stringify({ kind }) });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const d = await res.json();
        toast('Saved: ' + d.name);
        loadShots();
    } catch {
        toast('Capture failed', 'err');
    }
}

async function deleteShot(name) {
    try {
        const res = await api('/screenshot/delete', { method: 'POST', body: JSON.stringify({ name }) });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        toast('Deleted');
        loadShots();
    } catch {
        toast('Delete failed', 'err');
    }
}

function refreshFontSample() {
    const sample = document.getElementById('ovFontSample');
    if (sample && overlayCfg && overlayCfg.font_family) sample.style.fontFamily = overlayCfg.font_family;
}

function applyOverlayLocal() {
    if (!overlayCfg) return;
    const cfg = overlayCfg;

    const toggle = document.getElementById('ovToggle');
    if (toggle) toggle.className = 'toggle ' + (cfg.enabled ? 'on' : '');

    document.querySelectorAll('.swatch[data-color]').forEach(sw => {
        sw.classList.toggle('selected', sw.dataset.color === cfg.color);
    });
    const custom = document.getElementById('ovCustomColor');
    if (custom && document.activeElement !== custom) custom.value = cfg.color || '#7c6cff';
    const hex = document.getElementById('ovColorHex');
    if (hex && document.activeElement !== hex) hex.value = cfg.color || '#7c6cff';

    document.querySelectorAll('.pos-cell').forEach(cell => {
        cell.classList.toggle('selected', cell.dataset.pos === cfg.position);
    });

    const size = document.getElementById('ovSize');
    const sizeVal = document.getElementById('ovSizeVal');
    if (size) size.value = cfg.font_size || 14;
    if (sizeVal) sizeVal.textContent = cfg.font_size || 14;

    const font = document.getElementById('ovFont');
    if (font && document.activeElement !== font && cfg.font_family) {
        if (Array.from(font.options).some(o => o.value === cfg.font_family)) {
            font.value = cfg.font_family;
        } else if (font.options.length) {
            font.value = font.options[0].value;
        }
    }

    const hotkey = document.getElementById('ovHotkey');
    if (hotkey && document.activeElement !== hotkey && cfg.hotkey) hotkey.value = cfg.hotkey;

    document.querySelectorAll('.chip').forEach(chip => {
        chip.classList.toggle('selected', (cfg.fields || []).includes(chip.dataset.field));
    });

    const meta = document.getElementById('ovChipsMeta');
    if (meta) meta.textContent = `${(cfg.fields || []).length} of ${(cfg.available_fields || []).length} fields shown`;

    refreshFontSample();
}

function wireSettings() {
    const toggle = document.getElementById('ovToggle');
    if (toggle) toggle.addEventListener('click', () => {
        overlayCfg.enabled = !overlayCfg.enabled;
        toggle.className = 'toggle ' + (overlayCfg.enabled ? 'on' : '');
        patchOverlay({ enabled: overlayCfg.enabled });
    });

    document.querySelectorAll('.swatch[data-color]').forEach(sw => {
        sw.addEventListener('click', () => {
            overlayCfg.color = sw.dataset.color;
            document.querySelectorAll('.swatch[data-color]').forEach(s => s.classList.toggle('selected', s.dataset.color === overlayCfg.color));
            refreshFontSample();
            patchOverlay({ color: overlayCfg.color });
        });
    });

    const custom = document.getElementById('ovCustomColor');
    if (custom) custom.addEventListener('input', () => {
        overlayCfg.color = custom.value;
        const hex = document.getElementById('ovColorHex');
        if (hex) hex.value = custom.value;
        document.querySelectorAll('.swatch[data-color]').forEach(s => s.classList.toggle('selected', false));
        refreshFontSample();
        patchOverlay({ color: custom.value });
    });

    const hex = document.getElementById('ovColorHex');
    if (hex) {
        hex.addEventListener('input', () => {
            const v = hex.value.trim();
            if (!/^#[0-9a-fA-F]{6}$/.test(v)) return;
            overlayCfg.color = v;
            document.querySelectorAll('.swatch[data-color]').forEach(s => s.classList.toggle('selected', false));
            refreshFontSample();
        });
        hex.addEventListener('change', () => {
            let v = hex.value.trim();
            if (!/^#[0-9a-fA-F]{6}$/.test(v)) {
                toast('Invalid hex code', 'err');
                hex.value = overlayCfg.color || '#7c6cff';
                return;
            }
            overlayCfg.color = v;
            const customColor = document.getElementById('ovCustomColor');
            if (customColor) customColor.value = v;
            document.querySelectorAll('.swatch[data-color]').forEach(s => s.classList.toggle('selected', false));
            refreshFontSample();
            patchOverlay({ color: v });
        });
    }

    document.querySelectorAll('.pos-cell').forEach(cell => {
        cell.addEventListener('click', () => {
            overlayCfg.position = cell.dataset.pos;
            document.querySelectorAll('.pos-cell').forEach(c => c.classList.toggle('selected', c.dataset.pos === overlayCfg.position));
            refreshFontSample();
            patchOverlay({ position: overlayCfg.position });
        });
    });

    const size = document.getElementById('ovSize');
    const sizeVal = document.getElementById('ovSizeVal');
    if (size) size.addEventListener('input', () => {
        overlayCfg.font_size = Number(size.value);
        if (sizeVal) sizeVal.textContent = size.value;
        refreshFontSample();
        patchOverlay({ font_size: Number(size.value) });
    });

    const font = document.getElementById('ovFont');
    if (font) font.addEventListener('change', () => {
        overlayCfg.font_family = font.value;
        refreshFontSample();
        patchOverlay({ font_family: font.value });
    });

    const hotkey = document.getElementById('ovHotkey');
    const hotkeySave = document.getElementById('ovHotkeySave');
    if (hotkey && hotkeySave) hotkeySave.addEventListener('click', () => {
        let v = hotkey.value.trim();
        if (!v) { toast('Hotkey cannot be empty', 'err'); return; }
        overlayCfg.hotkey = v;
        toast('Hotkey saved: ' + v);
        patchOverlay({ hotkey: v });
    });

    document.querySelectorAll('.chip').forEach(chip => {
        chip.addEventListener('click', () => {
            const key = chip.dataset.field;
            const fields = overlayCfg.fields || [];
            const i = fields.indexOf(key);
            if (i >= 0) fields.splice(i, 1); else fields.push(key);
            overlayCfg.fields = fields;
            applyOverlayLocal();
            patchOverlay({ fields });
        });
    });

    const allBtn = document.getElementById('ovAll');
    if (allBtn) allBtn.addEventListener('click', () => {
        overlayCfg.fields = (overlayCfg.available_fields || []).map(f => f[0]);
        applyOverlayLocal();
        patchOverlay({ fields: overlayCfg.fields });
    });
    const noneBtn = document.getElementById('ovNone');
    if (noneBtn) noneBtn.addEventListener('click', () => {
        overlayCfg.fields = [];
        applyOverlayLocal();
        patchOverlay({ fields: [] });
    });

    const quitBtn = document.getElementById('quitBtn');
    if (quitBtn) quitBtn.addEventListener('click', () => {
        confirmBox('Shut down BloomPlay?', 'This closes the app, overlay, API and dashboard on the PC.', async () => {
            try {
                await api('/shutdown', { method: 'POST' });
                toast('Shutting down…');
            } catch { toast('Failed', 'err'); }
        });
    });
}

async function patchOverlay(patch) {
    try {
        const res = await api('/overlay/config', { method: 'POST', body: JSON.stringify(patch) });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const updated = await res.json();
        Object.assign(overlayCfg, updated);
        applyOverlayLocal();
    } catch {
        toast('Could not save setting', 'err');
    }
}

function offlineHtml() {
    return `<div class="offline-wrap">
        <div class="o-ico">📡</div>
        <h2>Can't reach the PC</h2>
        <p>BloomPlay seems offline. Make sure it's running on your PC and both devices are on the same network.</p>
        <button class="btn btn-primary" onclick="location.reload()">Retry</button>
    </div>`;
}

async function loadStats() {
    try {
        const res = await api('/stats');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        setOnline(true);
        if (!overviewBuilt || !document.getElementById('perfChart')) {
            viewEl.innerHTML = buildOverview();
            overviewBuilt = true;
        }
        updateOverview(data);
    } catch {
        setOnline(false);
        if (currentView === 'overview') viewEl.innerHTML = offlineHtml();
    }
}

async function loadHardware() {
    try {
        const res = await api('/hardware');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const fresh = await res.json();
        if (JSON.stringify(fresh) !== JSON.stringify(hardwareCache)) {
            hardwareCache = fresh;
            viewEl.innerHTML = renderHardware(fresh);
            wireHardware();
        } else {
            hardwareCache = fresh;
        }
    } catch {
        setOnline(false);
        if (currentView === 'hardware') viewEl.innerHTML = offlineHtml();
    }
}

async function loadShots() {
    try {
        const res = await api('/screenshot/list');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        const key = JSON.stringify(data);
        if (key !== shotsCache) {
            shotsCache = key;
            viewEl.innerHTML = renderScreenshots(data);
            wireScreenshots();
        }
    } catch {
        setOnline(false);
        if (currentView === 'screenshots') viewEl.innerHTML = offlineHtml();
    }
}

async function loadDevices() {
    try {
        const [dRes, bRes] = await Promise.all([api('/devices'), api('/devices/blocked')]);
        if (!dRes.ok || !bRes.ok) throw new Error('HTTP ' + dRes.status);
        const devices = await dRes.json();
        const blocked = await bRes.json();
        const devList = (devices && devices.devices) || [];
        const blockList = (blocked && blocked.blocked) || [];
        const key = JSON.stringify({
            devices: devList.map(d => ({ ip: d.ip, ua: d.user_agent, since: Math.floor(num(d.connected_since) / 60) * 60 })),
            blocked: blockList.map(b => ({ ip: b.ip, rem: Math.ceil(num(b.remaining_seconds) / 10) * 10 })),
        });
        if (key !== devicesCache) {
            devicesCache = key;
            viewEl.innerHTML = renderDevices({ devices: devList, blocked: blockList });
            wireDevices();
        }
    } catch {
        setOnline(false);
        if (currentView === 'devices') viewEl.innerHTML = offlineHtml();
    }
}

async function loadSettings() {
    try {
        const res = await api('/overlay/config');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const cfg = await res.json();
        overlayCfg = cfg;
        if (!settingsBuilt || !document.getElementById('ovToggle')) {
            viewEl.innerHTML = renderSettings(cfg);
            settingsBuilt = true;
            wireSettings();
        }
        applyOverlayLocal();
    } catch {
        setOnline(false);
        if (currentView === 'settings') viewEl.innerHTML = offlineHtml();
    }
}

async function loadSystem() {
    try {
        const res = await api('/system');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const s = await res.json();
        if (s.hostname) hostName.textContent = s.hostname;
        setOnline(true);
    } catch { setOnline(false); }
}

function setView(view) {
    if (view === currentView && viewEl.innerHTML) return;
    currentView = view;
    overviewBuilt = false;
    settingsBuilt = false;
    hardwareCache = null;
    shotsCache = null;
    devicesCache = null;
    NAV_ITEMS.forEach(item => item.classList.toggle('active', item.dataset.view === view));
    const meta = VIEW_META[view];
    pageTitle.textContent = meta.title;
    pageSub.textContent = meta.sub;
    startPolling();
}

function startPolling() {
    clearInterval(pollTimer);
    pollTimer = setInterval(poll, 1000);
    poll();
}

function poll() {
    if (currentView === 'overview') loadStats();
    else if (currentView === 'hardware') loadHardware();
    else if (currentView === 'screenshots') loadShots();
    else if (currentView === 'devices') loadDevices();
    else if (currentView === 'settings') loadSettings();
}

NAV_ITEMS.forEach(item => item.addEventListener('click', () => setView(item.dataset.view)));

(function init() {
    fmtClock();
    loadSystem();
    setView('overview');
})();
</script>
</body>
</html>
